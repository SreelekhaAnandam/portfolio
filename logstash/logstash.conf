input {
  # Option A: Receive logs from Filebeat or Beats shippers
  beats {
    port => 5044
  }
  
  # Option B: Or directly receive logs via TCP/HTTP from your app
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # You can parse, clean, or add fields to your portfolio logs here
  grok {
    match => { "message" => "%{IP:client_ip} - - [%{HTTPDATE:timestamp}] \"%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code}" }
  }
}

output {
  # Send the processed logs to your Elasticsearch container
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-logs-%{+YYYY.MM.dd}"
  }
}